[project]
name = "complaintlens"
version = "0.1.0"
description = "Multilingual complaint understanding, routing and verified response (NLP semester project)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Mohamed Aziz Mansour" },
    { name = "Rimel Zouari" },
]
dependencies = [
    "numpy>=2.0",
    "polars>=1.30",
    "scikit-learn>=1.6",
    "tzdata>=2025.2",  # Windows ships no time-zone database; needed for UTC datetimes
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/complaintlens"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
