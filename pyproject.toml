[project]
name = "complaintlens"
version = "0.1.0"
description = "Multilingual complaint understanding, routing and verified response (NLP semester project)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Mohamed Aziz Mansour" },
    { name = "Rimel Zouari" },
]
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.162.2",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "imap-tools>=1.16.0",
    "numpy>=2.0",
    "openai>=3.46.0",
    "polars>=1.30",
    "py3langid>=0.4.0",
    "pydantic-settings>=2.16.2",
    "scikit-learn>=1.6",
    "sqlmodel>=0.0.48",
    "tzdata>=2025.2",  # Windows ships no time-zone database; needed for UTC datetimes
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
complaintlens = "complaintlens.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/complaintlens"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM905"]  # word lists written as "a b c".split() are clearer

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
