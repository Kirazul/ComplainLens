<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="384" viewBox="0 0 960 384" role="img" aria-label="Five customer channels send messages to the ComplaintLens API, which understands, checks and answers them using an LLM, customer accounts and private policies. Verified answers go to the customer; the rest go to the agent console, where a person sends the reply.">
          <style>/* Diagram vocabulary (classes, so both themes come from the tokens). */
.b { fill: #ffffff; stroke: #b9b3e6; stroke-width: 1.5; }
.key { fill: #fdedd3; stroke: #a85f05; stroke-width: 2; }
.group { fill: none; stroke: #b9b3e6; stroke-width: 1.5; stroke-dasharray: 6 5; }
.frame { fill: #eeecfa; stroke: #b9b3e6; stroke-width: 1.5; }
.t { fill: #1e1b4b; font-size: 14px; font-weight: 600; }
.d { fill: #59567a; font-size: 12px; }
.lbl { fill: #59567a; font-size: 11.5px; font-style: italic; }
.h { fill: #1e1b4b; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }
.w { fill: none; stroke: #1e1b4b; stroke-width: 1.6; }
.wk { fill: none; stroke: #a85f05; stroke-width: 2; }
.wd { fill: none; stroke: #59567a; stroke-width: 1.4; stroke-dasharray: 5 4; }
.ah { fill: #1e1b4b; }
.ahk { fill: #a85f05; }
.ahd { fill: #59567a; }
 text { font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; }</style><rect width="100%" height="100%" fill="#eeecfa"/><defs>
            <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
            <marker id="a1d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahd" d="M0 0L10 5L0 10z"/></marker>
          </defs>
          <text class="h" x="20" y="40">CUSTOMERS WRITE</text>
          <g>
            <rect class="b" x="20" y="58" width="170" height="36" rx="18"/><text class="t" x="105" y="81" text-anchor="middle">Live chat</text>
            <rect class="b" x="20" y="102" width="170" height="36" rx="18"/><text class="t" x="105" y="125" text-anchor="middle">Contact form</text>
            <rect class="b" x="20" y="146" width="170" height="36" rx="18"/><text class="t" x="105" y="169" text-anchor="middle">Ride rating</text>
            <rect class="b" x="20" y="190" width="170" height="36" rx="18"/><text class="t" x="105" y="213" text-anchor="middle">Email</text>
            <rect class="b" x="20" y="234" width="170" height="36" rx="18"/><text class="t" x="105" y="257" text-anchor="middle">Community forum</text>
          </g>
          <path class="w" d="M190 76H210M190 120H210M190 164H210M190 208H210M190 252H210M210 76V252"/>
          <path class="w" d="M210 164H262" marker-end="url(#a1)"/>
          <text class="lbl" x="236" y="156" text-anchor="middle">message</text>

          <rect class="frame" x="265" y="40" width="375" height="250" rx="16"/>
          <text class="h" x="285" y="68">COMPLAINTLENS API</text>
          <rect class="b" x="281" y="92" width="104" height="150" rx="10"/>
          <text class="t" x="333" y="120" text-anchor="middle">Understand</text>
          <text class="d" x="333" y="146" text-anchor="middle">type, topic</text>
          <text class="d" x="333" y="164" text-anchor="middle">severity, risk</text>
          <text class="d" x="333" y="182" text-anchor="middle">language</text>
          <rect class="key" x="401" y="92" width="104" height="150" rx="10"/>
          <text class="t" x="453" y="120" text-anchor="middle">Check</text>
          <text class="d" x="453" y="146" text-anchor="middle">customer</text>
          <text class="d" x="453" y="164" text-anchor="middle">ride by its ID</text>
          <text class="d" x="453" y="182" text-anchor="middle">record facts</text>
          <rect class="b" x="521" y="92" width="104" height="150" rx="10"/>
          <text class="t" x="573" y="120" text-anchor="middle">Answer</text>
          <text class="d" x="573" y="146" text-anchor="middle">policy search</text>
          <text class="d" x="573" y="164" text-anchor="middle">cited draft</text>
          <text class="d" x="573" y="182" text-anchor="middle">verify, decide</text>
          <path class="w" d="M385 167H399" marker-end="url(#a1)"/>
          <path class="w" d="M505 167H519" marker-end="url(#a1)"/>

          <rect class="b" x="281" y="318" width="104" height="46" rx="10"/><text class="t" x="333" y="346" text-anchor="middle">LLM</text>
          <rect class="b" x="401" y="318" width="104" height="46" rx="10"/><text class="t" x="453" y="339" text-anchor="middle">Accounts</text><text class="d" x="453" y="355" text-anchor="middle">and rides</text>
          <rect class="b" x="521" y="318" width="104" height="46" rx="10"/><text class="t" x="573" y="339" text-anchor="middle">Policies</text><text class="d" x="573" y="355" text-anchor="middle">private</text>
          <path class="wd" d="M333 316V245" marker-end="url(#a1d)"/><path class="wd" d="M453 316V245" marker-end="url(#a1d)"/><path class="wd" d="M573 316V245" marker-end="url(#a1d)"/>
          <text class="lbl" x="641" y="303">read by the steps</text>

          <path class="w" d="M640 96H728" marker-end="url(#a1)"/>
          <text class="lbl" x="684" y="88" text-anchor="middle">verified</text>
          <path class="w" d="M640 226H728" marker-end="url(#a1)"/>
          <text class="lbl" x="684" y="218" text-anchor="middle">needs a person</text>
          <rect class="b" x="730" y="58" width="210" height="76" rx="12"/>
          <text class="t" x="835" y="90" text-anchor="middle">Reply to the customer</text>
          <text class="d" x="835" y="112" text-anchor="middle">chat, email, forum</text>
          <rect class="b" x="730" y="188" width="210" height="76" rx="12"/>
          <text class="t" x="835" y="220" text-anchor="middle">Agent console</text>
          <text class="d" x="835" y="242" text-anchor="middle">a person checks and sends</text>
          <path class="w" d="M835 188V137" marker-end="url(#a1)"/>
          <text class="lbl" x="843" y="167">agent sends</text>
        </svg>
