<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="382" viewBox="0 0 1000 382" role="img" aria-label="An agent signs in, sees the live inbox, opens a conversation and reads the evidence: why the AI decided, the ride check and the analysis. In the reply box the agent sends the AI suggestion, edits it or writes their own. The customer sees the reply; the agent can mark the conversation as resolved. If the customer writes again, it returns to the inbox's To do list. Administrators also manage the team.">
          <style>/* Diagram vocabulary (classes, so both themes come from the tokens). */
.b { fill: #ffffff; stroke: #b9b3e6; stroke-width: 1.5; }
.key { fill: #fdedd3; stroke: #a85f05; stroke-width: 2; }
.group { fill: none; stroke: #b9b3e6; stroke-width: 1.5; stroke-dasharray: 6 5; }
.frame { fill: #eeecfa; stroke: #b9b3e6; stroke-width: 1.5; }
.t { fill: #1e1b4b; font-size: 14px; font-weight: 600; }
.d { fill: #59567a; font-size: 12px; }
.lbl { fill: #59567a; font-size: 11.5px; font-style: italic; }
.h { fill: #1e1b4b; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }
.w { fill: none; stroke: #1e1b4b; stroke-width: 1.6; }
.wk { fill: none; stroke: #a85f05; stroke-width: 2; }
.wd { fill: none; stroke: #59567a; stroke-width: 1.4; stroke-dasharray: 5 4; }
.ah { fill: #1e1b4b; }
.ahk { fill: #a85f05; }
.ahd { fill: #59567a; }
 text { font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; }</style><rect width="100%" height="100%" fill="#eeecfa"/><defs>
            <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
            <marker id="a3d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahd" d="M0 0L10 5L0 10z"/></marker>
          </defs>
          <rect class="b" x="20" y="40" width="200" height="66" rx="12"/>
          <text class="t" x="120" y="66" text-anchor="middle">Sign in</text>
          <text class="d" x="120" y="86" text-anchor="middle">username and password</text>
          <rect class="b" x="260" y="40" width="200" height="66" rx="12"/>
          <text class="t" x="360" y="62" text-anchor="middle">Live inbox</text>
          <text class="d" x="360" y="81" text-anchor="middle">To do, Solved by AI,</text>
          <text class="d" x="360" y="97" text-anchor="middle">Waiting, Closed</text>
          <rect class="b" x="500" y="40" width="200" height="66" rx="12"/>
          <text class="t" x="600" y="66" text-anchor="middle">Open a conversation</text>
          <text class="d" x="600" y="86" text-anchor="middle">every message, in order</text>
          <rect class="key" x="740" y="40" width="240" height="66" rx="12"/>
          <text class="t" x="860" y="62" text-anchor="middle">Read the evidence</text>
          <text class="d" x="860" y="81" text-anchor="middle">why the AI decided, ride check,</text>
          <text class="d" x="860" y="97" text-anchor="middle">what it understood</text>
          <path class="w" d="M220 73H258" marker-end="url(#a3)"/><path class="w" d="M460 73H498" marker-end="url(#a3)"/><path class="w" d="M700 73H738" marker-end="url(#a3)"/>

          <path class="w" d="M860 106V158" marker-end="url(#a3)"/>
          <rect class="b" x="740" y="160" width="240" height="82" rx="12"/>
          <text class="t" x="860" y="186" text-anchor="middle">Reply box</text>
          <text class="d" x="860" y="206" text-anchor="middle">AI suggestion, sources checked</text>
          <text class="d" x="860" y="224" text-anchor="middle">send, edit, or write your own</text>
          <path class="w" d="M740 201H602" marker-end="url(#a3)"/>
          <text class="lbl" x="671" y="193" text-anchor="middle">send reply</text>
          <rect class="b" x="380" y="160" width="220" height="82" rx="12"/>
          <text class="t" x="490" y="186" text-anchor="middle">Customer sees it</text>
          <text class="d" x="490" y="206" text-anchor="middle">chat, ticket page, email,</text>
          <text class="d" x="490" y="224" text-anchor="middle">or a forum comment</text>
          <path class="w" d="M380 201H360V108" marker-end="url(#a3)"/>
          <text class="lbl" x="352" y="170" text-anchor="end">writes again:</text>
          <text class="lbl" x="352" y="186" text-anchor="end">back to To do</text>
          <path class="w" d="M490 242V298" marker-end="url(#a3)"/>
          <text class="lbl" x="498" y="275">done</text>
          <rect class="b" x="380" y="300" width="220" height="62" rx="12"/>
          <text class="t" x="490" y="326" text-anchor="middle">Mark as resolved</text>
          <text class="d" x="490" y="346" text-anchor="middle">reopens if they write again</text>

          <path class="wd" d="M120 106V258" marker-end="url(#a3d)"/>
          <text class="lbl" x="128" y="186">administrators</text>
          <rect class="group" x="20" y="260" width="200" height="66" rx="12"/>
          <text class="t" x="120" y="286" text-anchor="middle">Team page</text>
          <text class="d" x="120" y="306" text-anchor="middle">add agents, reset passwords</text>
        </svg>
